name: Swift

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners
    # xcode-27 is a public-preview image pinned to Xcode's major version (arm64 only), not a
    # macOS-version label like macos-26 - https://github.blog/changelog/2026-07-16-xcode-27-runner-image-now-in-public-preview/
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Cancel previous jobs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
      - name: Git - Checkout
        uses: actions/checkout@v5.0.0
        with:
          ref: ${{ github.ref }}
      - name: Setup - Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v
